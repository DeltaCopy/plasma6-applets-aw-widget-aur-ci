# Package and publish release
name: plasma6-applets-aw-widget-aur-ci
on:
  schedule:
    - cron: "0 00 * * *" # At 00:00 daily
env:
  AUR_AWW_REPO: https://aur.archlinux.org/plasma6-applets-advanced-weather-widget.git
  GIT_USER: DeltaCopy
  GIT_EMAIL: 7x0bb03yq@mozmail.com
  REPO_DEV: pnedyalkov91
  REPO_NAME: advanced-weather-widget
jobs:
  GetLatestVersion:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.step_version.outputs.VERSION }}
    steps:
      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq
      - name: Get latest version
        id: step_version
        run: |
          # get latest release tag from remote

           latest_release_tag=$(curl -s https://api.github.com/repos/$REPO_DEV/$REPO_NAME/releases/latest |  jq -r '.tag_name')

           echo "INFO: Latest tag = $latest_release_tag"

           if [ ! -z $latest_release_tag ] || [ $latest_release_tag != null ]; then
             latest_tag=$(echo $latest_release_tag | sed 's/v//')
             echo "VERSION=${latest_release_tag}" >> "$GITHUB_OUTPUT"
           else
             echo "Latest tag is unknown"
             exit 1
           fi

      - name: Checkout local
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository }}

      - name: Update README
        run: |
          echo ${{ steps.step_version.outputs.VERSION }}
          cat << EOF > README.md
            # Plasma 6 Applets - Advanced Weather Widget

            Scheduled pipeline to publish updated PKGBUILD for plasma6-applets-advanced-weather-widget AUR package.

            Upstream repository: https://github.com/pnedyalkov91/advanced-weather-widget

            AUR package: https://aur.archlinux.org/packages/plasma6-applets-advanced-weather-widget

            [![plasma6-applets-aw-widget-aur-ci](https://github.com/DeltaCopy/plasma6-applets-aw-widget-aur-ci/actions/workflows/plasma6-applets-aw-widget-aur-ci.yml/badge.svg)](https://github.com/DeltaCopy/plasma6-applets-aw-widget-aur-ci/actions/workflows/plasma6-applets-aw-widget-aur-ci.yml)

            ## Latest version
            <a href="https://github.com/pnedyalkov91/advanced-weather-widget/releases">
              <img src="https://img.shields.io/badge/AdvancedWeatherWidget-${{ steps.step_version.outputs.VERSION }}-orange" alt="AdvancedWeatherWidget-${{ steps.step_version.outputs.VERSION }}">
            </a>
          EOF
          git config --global user.name $GIT_USER
          git config --global user.email ecto1@duck.com
          git add README.md
          git commit --allow-empty -m "[plasma6-applets-aw-widget AUR CI]: Update version"
          git push --force -v
  UpdatePackages:
    runs-on: ubuntu-latest
    needs: GetLatestVersion
    container: archlinux:latest
    steps:
      - name: Checkout local
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository }}
          sparse-checkout: .github/assets
          sparse-checkout-cone-mode: false

      - name: System update
        run: pacman -Syu --noconfirm
      - name: Install sudo and compile dependencies
        run: |
          # openssh required for creating the ssh aur config
          # base-devel includes build dependencies (fakeroot, make, gcc, pkgconf)
          # git to clone repositories
          pacman -Syq base-devel openssh git --noconfirm

      - name: Setup build user
        run: |
          useradd --create-home --shell /bin/bash builduser -m # Create the builduser
          passwd -d builduser # Delete the buildusers password
          printf 'builduser ALL=(ALL) ALL\n' | tee -a /etc/sudoers # Allow the builduser passwordless sudo

      - name: Create SSH AUR config & clone
        env:
          AUR_PRIV: ${{ secrets.AUR_P1 }}
        run: |
          mkdir -p /home/builduser/.ssh
          touch /home/builduser/.ssh/known_hosts
          cp $GITHUB_WORKSPACE/.github/assets/ssh_config /home/builduser/.ssh/config

          chmod -vR 600 /home/builduser/.ssh/* 

          ssh-keyscan -v -t rsa,ecdsa,ed25519 aur.archlinux.org >>/home/builduser/.ssh/known_hosts

          echo "$AUR_PRIV" > /home/builduser/.ssh/aur
          chmod -R 600 /home/builduser/.ssh/aur*

          ssh-keygen -vy -f /home/builduser/.ssh/aur > /home/builduser/.ssh/aur.pub

          chown -vR builduser:builduser /home/builduser

      - name: Git clone AUR repos
        run: |
          sudo -u builduser bash -c 'git clone ${{ env.AUR_AWW_REPO }} /tmp/aww'

          git config --global --add safe.directory '/tmp/aww'
          git config --global user.name ${{ env.GIT_USER}}
          git config --global user.email ${{ env.GIT_EMAIL}}

      - name: Update package files
        run: |
          echo ${{ needs.GetLatestVersion.outputs.VERSION }}
          echo RELEASE_VERSION=${{ needs.GetLatestVersion.outputs.VERSION }} >> "$GITHUB_ENV"

          latest_tag=$(echo ${{ needs.GetLatestVersion.outputs.VERSION }}| sed 's/v//')

          cp $GITHUB_WORKSPACE/.github/assets/PKGBUILD.template /tmp/aww/PKGBUILD
          cp $GITHUB_WORKSPACE/.github/assets/.SRCINFO.template /tmp/aww/.SRCINFO

          sed -i 's/${version}/'${latest_tag}'/' /tmp/aww/PKGBUILD
          sed -i 's/${version}/'${latest_tag}'/' /tmp/aww/.SRCINFO
          
          sha256sum_aww=$(curl -Ls https://github.com/$REPO_DEV/$REPO_NAME/archive/refs/tags/${latest_tag}.tar.gz | sha256sum | awk {'print $1'})

          sed -i 's/${sha256sums}/'${sha256sum_aww}'/' /tmp/aww/PKGBUILD
          sed -i 's/${sha256sums}/'${sha256sum_aww}'/' /tmp/aww/.SRCINFO

          chown -R builduser:builduser /tmp/aww

      - name: Print pkgbuild & .srcinfo
        run: |
          echo "#############################"

          cat /tmp/aww/PKGBUILD
          cat /tmp/aww/.SRCINFO

      - name: Test Advanced Weather Widget package
        run: |
          sudo -u builduser bash -c 'cd /tmp/aww; makepkg -s --noconfirm; test $? -eq 0 && touch /tmp/.awwbuild'
          echo "AWW_MODIFIED=$(git -C /tmp/aww status -s PKGBUILD | wc -l)" >> "$GITHUB_ENV"
      
      - name: Publish AUR package Advanced Weather Widget
        if: env.AWW_MODIFIED == 1
        run: |
          echo "Changes found, publish required."
          if [ -f  /tmp/.awwbuild ]; then
            sudo -u builduser bash -c 'cd /tmp/aww; git remote add aur "ssh://aur@aur.archlinux.org/plasma6-applets-advanced-weather-widget.git"; \
            git config --global user.name ${{ env.GIT_USER}}
            git config --global user.email ${{ env.GIT_EMAIL}}
            git add -fv PKGBUILD .SRCINFO && git commit -m "[GitHub DeltaCopy/plasma6-applets-aw-widget-aur-ci]: Version ${{ env.RELEASE_VERSION }}" && git push -v aur master'
          fi
